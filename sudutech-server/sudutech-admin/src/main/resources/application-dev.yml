spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地开发默认连接本机 MySQL；请按实际环境修改，敏感信息建议用环境变量注入
    url: jdbc:mysql://127.0.0.1:3306/sudutech_lite?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      # 本机 Redis 密码请通过环境变量 REDIS_PASSWORD 注入，勿提交到代码仓库
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

# 本地覆盖示例：在 application-local.yml（已被 .gitignore 忽略）中填写真实密码
#   spring:
#     data:
#       redis:
#         password: your-real-password
